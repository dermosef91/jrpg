<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080605">
<title>EMBERROOT</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; background: #080605; overflow: hidden;
    overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  body { display: grid; place-items: center; touch-action: none; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  #boot { color: #8a3210; font-size: 12px; letter-spacing: .3em; }

  /* --- touch controls --- */
  .touch { position: fixed; inset: 0; pointer-events: none; z-index: 10; --key: clamp(38px, 9vh, 58px); }
  .touch-pad, .touch-btns { position: fixed; pointer-events: auto; touch-action: none; }
  .touch-pad { display: grid; grid-template: repeat(3, var(--key)) / repeat(3, var(--key)); }
  .touch-btns { display: flex; gap: 10px; }
  .touch-key {
    display: grid; place-items: center; margin: 0; padding: 0;
    width: var(--key); height: var(--key);
    font: inherit; font-size: calc(var(--key) * .38);
    color: #ea8038; background: #14100ecc; border: 2px solid #4e372c; border-radius: 8px;
    transition: background .06s linear, transform .06s linear;
  }
  .touch-key.round { width: calc(var(--key) * 1.3); height: calc(var(--key) * 1.3); border-radius: 50%; }
  .touch-key.down { background: #d9682a; color: #0f0a09; transform: scale(.94); }
  .touch.overlay .touch-key { opacity: .72; }
  .touch.overlay .touch-key.down { opacity: 1; }

  /* --- portrait --- */
  #rotate {
    display: none; position: fixed; inset: 0; z-index: 20; background: #080605;
    place-items: center; text-align: center; padding: 24px; color: #d8c9ac;
  }
  #rotate p { max-width: 22ch; line-height: 1.6; font-size: 15px; }
  #rotate small { display: block; margin-top: 12px; color: #7d7160; font-size: 12px; }
  #rotate .g { font-size: 40px; color: #ea8038; margin-bottom: 16px; }
  body.portrait #rotate { display: grid; }
  body.portrait .touch { display: none; }
</style>
</head>
<body>
  <div id="boot">EMBERROOT</div>
  <div id="rotate" role="status">
    <div>
      <div class="g">&#9645;</div>
      <p>Turn your device sideways.</p>
      <small>The galleries are wider than they are tall.</small>
    </div>
  </div>
  <script type="module">
    import { boot } from './src/main.js';
    boot(document.getElementById('boot')).catch((err) => {
      const el = document.getElementById('boot');
      if (el) el.textContent = 'failed: ' + err.message;
      console.error(err);
    });
  </script>
</body>
</html>
